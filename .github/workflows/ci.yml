name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the base ref is available for oasdiff
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint OpenAPI spec (Redocly)
        run: npx --yes @redocly/cli@latest lint --config docs/api/redocly.yaml docs/api/openapi.yaml
      - name: Detect breaking contract changes (oasdiff)
        # Only meaningful on PRs: compare the spec against the PR base branch.
        if: github.event_name == 'pull_request'
        run: |
          set -e
          git fetch origin "${{ github.base_ref }}"
          if git cat-file -e "origin/${{ github.base_ref }}:docs/api/openapi.yaml" 2>/dev/null; then
            git show "origin/${{ github.base_ref }}:docs/api/openapi.yaml" > /tmp/base.yaml
            cp docs/api/openapi.yaml /tmp/head.yaml
            docker run --rm -v /tmp:/spec oasdiff/oasdiff:latest breaking /spec/base.yaml /spec/head.yaml
          else
            echo "No baseline spec on base ref; skipping breaking-change check."
          fi

  gen-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum
      - run: go mod download
      # Versions are pinned via go.mod (see backend/tools.go), so plain
      # `go install <path>` resolves to the exact committed version.
      - name: Install codegen tools
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen
          go install github.com/sqlc-dev/sqlc/cmd/sqlc
      - name: Verify generated code is in sync
        run: make gen-check

  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: backend
      - run: go test -race ./...

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (smoke)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: expense-tracker-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
