# Add-transaction happy path for the mobile app (apps/mobile).
#
# Regression guard for the SQLite create() bug where a freshly created
# transaction tripped `NOT NULL constraint failed: transactions.version`
# (CreateTransactionPayload omits `version`, so a raw cast bound SQL NULL on a
# column the INSERT listed explicitly). The whole point of this flow is that it
# FAILS on that unfixed code and PASSES once create() assigns `version = 1`.
#
# Why the kill + relaunch (without clearState) instead of asserting right after
# Save: `useCreateTransaction` writes a provisional row into the react-query
# cache optimistically (onMutate) and rolls it back on failure (onError), so
# right after Save a failed create can look briefly persisted. Relaunching
# WITHOUT wiping state forces a fresh process: the in-memory cache is gone and
# the list is re-read from SQLite. A transaction whose create() rolled back is
# absent from the durable store; a persisted one survives. This also satisfies
# design section 13's "data is not lost" / persists-across-restart contract.
#
# Locale/currency are deterministic because `clearState: true` on the first
# launch wipes MMKV, so the app re-seeds in the default en/USD locale (the same
# assumption the launch smoke relies on for its "Expense" / "Add" asserts).
#
# Prerequisites + how to run: see README.md "Testing (E2E launch smoke)".
appId: works.earendil.expensetracker
name: Add transaction
tags:
  - e2e
  - transaction
---
# Cold boot: wipe the sandbox so MMKV + SQLite re-initialize and the seed
# (en locale, USD "Cash" starter account, starter categories) runs fresh. The
# app starts on the Home input screen with the hero amount field focused.
- launchApp:
    clearState: true

# The type segmented control and the Save button only render as part of the
# Home input form (TransactionInput). Seeing them proves "open = ready to enter
# a transaction" (design section 3). Default type is "expense", so the submit
# label is "Add". `^Add$` is a regex anchored to the whole label so it matches
# the Save button exactly and NOT the comment-field placeholder "Add a note".
- assertVisible:
    text: "Expense"
- assertVisible:
    text: "^Add$"

# Enter an expense amount. The hero field autofocuses on launch, but tap it
# first so the input target is unambiguous regardless of focus timing.
- tapOn:
    text: "Amount, US Dollar"
- inputText: "12.50"
# Dismiss the keypad before saving: the full-width Save button lives in the
# thumb zone and the numeric keypad covers it while up, so tapping through the
# keypad would miss it. The amount field's return key is "Done".
- tapOn:
    text: "Done"

# Save the expense (expense submit label is "Add").
- tapOn:
    text: "^Add$"

# Persisted == survives a restart. Kill + relaunch WITHOUT clearing state so a
# fresh JS process re-reads from SQLite (the optimistic cache is gone). On the
# unfixed code the create() rolled back, so nothing is in the store; on the
# fixed code the row is durable.
- killApp
- launchApp:
    clearState: false

# Home input screen mounted again.
- assertVisible:
    text: "Expense"

# The persisted expense is visible in the recent-transactions list beneath the
# form - its row reads "<icon>, Food, Cash, − $12.50" - and the header balance
# now reflects it (-$12.50). Match the amount with regex wildcards (Maestro
# matches selectors as a full-match regex against the element's accessibility
# text, so the bare "12.50" would not match the full row) and wait for the
# post-relaunch list query to resolve. On the unfixed code this fails: the
# amount field is empty on the fresh launch and no transaction was stored, so
# "12.50" appears nowhere.
- extendedWaitUntil:
    visible:
      text: ".*12.50.*"
    timeout: 15000
