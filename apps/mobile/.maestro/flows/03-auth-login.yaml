# Reaches an (auth) screen. The skeleton has no session gate and no in-app link
# into (auth), so the flow drives the route the way deep links do: through the
# app scheme (expensetracker, from app.json) once the dev build is running.
appId: com.anonymous.mobile
---
- runFlow: ../_launch.yaml
- openLink: expensetracker://login
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible:
      id: screen-login
    timeout: 30000
- assertVisible:
    id: screen-login
- takeScreenshot: auth-login
