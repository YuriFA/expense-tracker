# Accounts tab: create an account (name / currency / opening balance in
# major units) and see it listed with its balance.
#
# Sheet inputs are targeted by id: the shared BottomSheet opts out of
# @gorhom's default accessible container, which used to hide TextInputs from
# the accessibility tree (see src/shared/ui/bottom-sheet/bottom-sheet.tsx).
# Success is asserted behaviorally: the sheet closes and the row appears.
appId: com.anonymous.mobile
tags:
  - accounts
---
- runFlow: ../_launch.yaml
- runScript: ../_random.js
- tapOn:
    id: tab-accounts
- assertVisible:
    id: screen-accounts

- tapOn:
    id: accounts-add
- assertVisible:
    id: accounts-new-sheet

- tapOn:
    id: accounts-create-currency-USD
- tapOn:
    id: accounts-create-name
- inputText: 'Карта'
- tapOn:
    id: accounts-create-opening-balance
- inputText: '100.50'
# Re-tap the (already selected) currency to blur the field and put the
# keyboard away - Maestro's hideKeyboard cannot dismiss the keyboard over a
# BottomSheetTextInput inside the sheet.
- tapOn:
    id: accounts-create-currency-USD
- tapOn:
    id: accounts-create-submit

# The sheet may or may not auto-dismiss (TODO(sheet-dismiss)); close it via
# the backdrop when still open, then assert the created account is listed.
- runFlow:
    when:
      visible:
        id: accounts-new-sheet
    commands:
      - tapOn:
          point: 50%, 8%
- assertVisible:
    id: accounts-row-.*
