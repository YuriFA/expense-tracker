# TODO(sheet-e2e): KNOWN-FAILING - typing into sheet inputs is unstable in
# Expo Go e2e (inputs invisible to the accessibility tree inside modals +
# keyboard lift shifting measured tap points; see the TODO in
# src/shared/ui/bottom-sheet/bottom-sheet.tsx). The covered behavior is
# unit/component-tested in jest; revisit once sheet inputs become e2e-stable.
# Accounts tab: create an account (name / currency / opening balance in
# major units) and see it listed with its balance.
#
# NOTE on coordinates: inside bottom sheets Expo Go exposes only explicitly
# accessible elements (buttons/chips) to the accessibility tree, so the text
# inputs are focused by POINT (measured sheet geometry) instead of id.
# Success is asserted behaviorally: the sheet closes and the row appears.
appId: host.exp.Exponent
tags:
  - accounts
---
- runFlow: ../_launch.yaml
- runScript: ../_random.js
- tapOn:
    id: tab-accounts
- assertVisible:
    id: screen-accounts

- tapOn:
    id: accounts-add
- assertVisible:
    id: accounts-new-sheet

# Currency first (no keyboard yet), then name and opening balance - all
# fields sit above the keyboard line on the 75% sheet. The final currency
# tap dismisses the keyboard so the submit button is reachable.
- tapOn:
    id: accounts-create-currency-USD
- tapOn:
    point: 50%, 27%
- inputText: 'Карта'
- tapOn:
    point: 50%, 45%
- inputText: '100.50'
- tapOn:
    id: accounts-create-currency-USD
- tapOn:
    id: accounts-create-submit

# The sheet may or may not auto-dismiss (TODO(sheet-dismiss)); close it via
# the backdrop when still open, then assert the created account is listed.
- runFlow:
    when:
      visible:
        id: accounts-new-sheet
    commands:
      - tapOn:
          point: 50%, 8%
- assertVisible:
    id: accounts-row-.*
