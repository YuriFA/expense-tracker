# Dashboard: create a category (name / type / icon / color) through the
# predefined pickers. Unique names keep the suite re-runnable.
#
# The name field is targeted by id (the shared BottomSheet exposes sheet
# inputs to the accessibility tree); success is proven behaviorally:
# submitting the SAME name again must surface the unique-name error alert,
# which only happens if the first create persisted.
appId: com.anonymous.mobile
tags:
  - categories
---
- runFlow: ../_launch.yaml
- runScript: ../_random.js
- assertVisible:
    id: screen-dashboard

- tapOn:
    id: home-new-category
- assertVisible:
    id: home-new-category-sheet

- tapOn:
    id: home-new-category-name
- inputText: 'Транспорт ${output.suffix}'
- tapOn:
    id: home-new-category-icon-bus
- tapOn:
    id: home-new-category-color-7c5cff
- tapOn:
    id: home-new-category-submit

# Same name again -> the unique-name guard fires
- tapOn:
    id: home-new-category-name
- inputText: 'Транспорт ${output.suffix}'
- tapOn:
    id: home-new-category-submit
- assertVisible:
    id: home-new-category-error
- tapOn:
    point: 50%, 8%
