# Speed dial: create an expense end-to-end through the redesigned keypad
# sheet. Requires an account and an expense category to exist - 05-add-account
# and 06-add-category create them, so run the suite in order (fresh local
# database starts empty).
#
# The amount is entered ONLY through the custom keypad - the amount is not a
# TextInput, so the system keyboard never appears for it. There is no
# inputText step and no keyboard-reflow ordering to work around (the old
# flow's "chips before amount" workaround is obsolete).
#
# The submit stays disabled until account, category, and a positive amount
# are all set (live validation), so the flow fills them before submitting.
appId: com.anonymous.mobile
tags:
  - transactions
---
- runFlow: ../_launch.yaml
- assertVisible:
    id: screen-dashboard

- tapOn:
    id: speed-dial-fab
- assertVisible:
    id: speed-dial-action-expense
- tapOn:
    id: speed-dial-action-expense
- assertVisible:
    id: new-transaction-sheet
- assertVisible:
    id: new-transaction-keypad

# Amount through the custom keypad only - never the system keyboard.
- tapOn:
    id: new-transaction-key-2
- tapOn:
    id: new-transaction-key-5
- tapOn:
    id: new-transaction-key-0

# Account through the picker sheet stacked above the transaction sheet.
- tapOn:
    id: new-transaction-account
- assertVisible:
    id: new-transaction-account-picker-list
- tapOn:
    id: new-transaction-account-option-.*
    index: 0

# Category through the full picker opened from the quick bar's menu button.
- tapOn:
    id: new-transaction-category-menu
- assertVisible:
    id: new-transaction-category-picker-list
- tapOn:
    id: new-transaction-category-option-.*
    index: 0

- tapOn:
    id: new-transaction-submit

# The sheet may or may not auto-dismiss (TODO(sheet-dismiss)); close it via
# the backdrop when still open, then verify the expense on the dashboard.
- runFlow:
    when:
      visible:
        id: new-transaction-sheet
    commands:
      - tapOn:
          point: 50%, 8%
- tapOn:
    id: home-all-expenses
- assertVisible:
    id: home-expenses-sheet
- assertVisible:
    id: home-expense-row-.*
- tapOn:
    point: 50%, 8%
