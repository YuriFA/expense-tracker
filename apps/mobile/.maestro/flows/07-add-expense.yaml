# Speed dial: create an expense end-to-end. Requires an account and an
# expense category to exist - 05-add-account and 06-add-category create
# them, so run the suite in order (fresh local database starts empty).
#
# Chips are picked BEFORE typing the amount: with the keyboard up the sheet
# content reflows (interactive keyboard behavior), so tapping chips first
# keeps every step at settled geometry. The submit button stays visible
# above the raised keyboard - Maestro's hideKeyboard cannot dismiss a
# BottomSheetTextInput keyboard, and taps on chips don't blur the field.
appId: com.anonymous.mobile
tags:
  - transactions
---
- runFlow: ../_launch.yaml
- assertVisible:
    id: screen-dashboard

- tapOn:
    id: speed-dial-fab
- assertVisible:
    id: speed-dial-action-expense
- tapOn:
    id: speed-dial-action-expense
- assertVisible:
    id: new-transaction-sheet

# Submit-driven validation: tapping save with an empty amount shows the
# per-field error instead of a dead disabled button (pending-only disabling).
- tapOn:
    id: new-transaction-submit
- assertVisible:
    id: new-transaction-amount-error

- tapOn:
    id: new-transaction-account-.*
    index: 0
- tapOn:
    id: new-transaction-category-.*
    index: 0
- tapOn:
    id: new-transaction-amount
- inputText: '250.00'
- tapOn:
    id: new-transaction-submit

# The sheet may or may not auto-dismiss (TODO(sheet-dismiss)); close it via
# the backdrop when still open, then verify the expense on the dashboard.
- runFlow:
    when:
      visible:
        id: new-transaction-sheet
    commands:
      - tapOn:
          point: 50%, 8%
- tapOn:
    id: home-all-expenses
- assertVisible:
    id: home-expenses-sheet
- assertVisible:
    id: home-expense-row-.*
- tapOn:
    point: 50%, 8%
