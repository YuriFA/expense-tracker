# TODO(sheet-e2e): KNOWN-FAILING - typing into sheet inputs is unstable in
# Expo Go e2e (inputs invisible to the accessibility tree inside modals +
# keyboard lift shifting measured tap points; see the TODO in
# src/shared/ui/bottom-sheet/bottom-sheet.tsx). The covered behavior is
# unit/component-tested in jest; revisit once sheet inputs become e2e-stable.
# Home screen: period navigation, summary modes, sheets, quick actions.
#
# Runs on the REAL local database (mocks are gone): the month/mode switching
# assertions work on any data state; the sheet assertions rely on the
# account/category/expense created by the earlier flows in the same suite run.
#
# Conventions: assert/tap by testID only. Text asserts are limited to the
# pre-modal steps: after a native modal (bottom sheet) closes in Expo Go,
# the main window's text accessibility labels detach until relaunch, so
# text matching there is unreliable (ids keep working).
appId: host.exp.Exponent
tags:
  - home
---
- runFlow: ../_launch.yaml
- assertVisible:
    id: screen-dashboard

# Pre-modal: summary renders with the default Expenses mode
- assertVisible:
    text: '.*Расходы.*'

# Period navigation: the previous month starts empty on a fresh database
- tapOn:
    id: home-period-prev
- tapOn:
    id: home-period-next

# Summary mode switcher (bottom sheet)
- tapOn:
    id: home-summary-mode
- assertVisible:
    id: home-mode-sheet
- tapOn:
    id: home-mode-option-total-balance
- assertNotVisible:
    id: home-mode-sheet
# Prove the mode switched by the active marker, not by (detached) text
- tapOn:
    id: home-summary-mode
- assertVisible:
    id: home-mode-option-total-balance-active
# Dismiss via the sheet backdrop. The shared BottomSheet (@gorhom) exposes no
# scrim testID; tapping just above the sheet hits the real backdrop, which
# closes on press (enableBackdropPress). Same trick closes the sheets below.
- tapOn:
    point: 50%, 8%

# All-expenses sheet lists the period's expenses (random ids -> regex)
- tapOn:
    id: home-all-expenses
- assertVisible:
    id: home-expenses-sheet
- assertVisible:
    id: home-expense-row-.*
- tapOn:
    point: 50%, 8%

# Category-filtered sheet opens for a category with spending
- tapOn:
    id: home-category-.*
    index: 0
- assertVisible:
    id: home-expenses-sheet
- tapOn:
    point: 50%, 8%

# Quick action placeholder
- tapOn:
    id: home-quick-goals
- assertVisible:
    id: screen-goals
