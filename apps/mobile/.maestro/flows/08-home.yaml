# Home screen: period navigation, summary modes, sheets, quick actions.
#
# Runs on the REAL local database (mocks are gone): the month/mode switching
# assertions work on any data state; the sheet assertions rely on the
# account/category/expense created by the earlier flows in the same suite run.
#
# Conventions: assert/tap by testID only. Text asserts are limited to the
# pre-modal steps: after a native modal (bottom sheet) closes, the main
# window's text accessibility labels can detach until relaunch, so text
# matching there is unreliable (ids keep working).
appId: com.anonymous.mobile
tags:
  - home
---
- runFlow: ../_launch.yaml
- assertVisible:
    id: screen-dashboard

# Pre-modal: summary renders with the default Expenses mode
- assertVisible:
    text: '.*Расходы.*'

# Period navigation: the previous month starts empty on a fresh database
- tapOn:
    id: home-period-prev
- tapOn:
    id: home-period-next

# Summary mode switcher (bottom sheet)
- tapOn:
    id: home-summary-mode
- assertVisible:
    id: home-mode-sheet
- tapOn:
    id: home-mode-option-total-balance
- assertNotVisible:
    id: home-mode-sheet
# Prove the mode switched by the active marker, not by (detached) text
- tapOn:
    id: home-summary-mode
- assertVisible:
    id: home-mode-option-total-balance-active
# Dismiss via the sheet backdrop. The shared BottomSheet (@gorhom) exposes no
# scrim testID; tapping just above the sheet hits the real backdrop, which
# closes on press (enableBackdropPress). Same trick closes the sheets below.
- tapOn:
    point: 50%, 8%

# All-expenses sheet lists the period's expenses grouped by day (random ids -> regex)
- tapOn:
    id: home-all-expenses
- assertVisible:
    id: home-expenses-sheet
- assertVisible:
    id: home-expense-row-.*
- assertVisible:
    id: home-expense-day-.*
# The footer button stacks the expense-creation sheet on top of the list
- tapOn:
    id: home-new-expense-button
- assertVisible:
    id: home-new-expense-sheet
# Close the stacked sheet, then the expenses sheet behind it
- tapOn:
    point: 50%, 8%
- tapOn:
    point: 50%, 8%

# Category-filtered sheet opens for a category with spending
- tapOn:
    id: home-category-.*
    index: 0
- assertVisible:
    id: home-expenses-sheet
- tapOn:
    point: 50%, 8%

# Quick action placeholder
- tapOn:
    id: home-quick-goals
- assertVisible:
    id: screen-goals
