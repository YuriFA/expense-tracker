# Sync smoke (Expo Go + a real backend): sign in from Settings, land back on
# the Dashboard with the sync status badge visible (authenticated + synced),
# then sign out and confirm the badge disappears (anonymous = offline-first,
# nothing to show).
#
# Prerequisites: the backend on :8080, the test user provisioned (see
# _launch.js for the curl), the dev server started with
# EXPO_PUBLIC_API_URL=http://localhost:8080 (localhost works from the iOS
# simulator), and the simulator pasteboard primed with the test password
# (scripts/e2e/run-maestro-ios.sh does it via `xcrun simctl pbcopy`).
# Override credentials with MAESTRO_TEST_EMAIL/PASSWORD.
appId: com.anonymous.mobile
---
- runFlow: ../_launch.yaml
- tapOn:
    id: tab-settings
- extendedWaitUntil:
    visible:
      id: screen-settings
    timeout: 15000
- tapOn:
    id: settings-login-button
- extendedWaitUntil:
    visible:
      id: screen-login
    timeout: 15000
- tapOn:
    id: login-email-input
- eraseText
- inputText: ${output.testEmail}
# inputText AND Maestro's pasteText both mis-deliver text into this real
# secure field (iOS 18.6 / dev build: 0-3 of 17 chars land), and setClipboard
# fills only Maestro's internal clipboard - it never reaches the iOS
# pasteboard. The reliable route is the native context-menu Paste: the e2e
# runner primes the simulator pasteboard with MAESTRO_TEST_PASSWORD via
# `xcrun simctl pbcopy` right before maestro starts (see
# scripts/e2e/run-maestro-ios.sh), and nothing else in the suite touches the
# pasteboard.
- longPressOn:
    id: login-password-input
- tapOn:
    text: Paste
# iOS offers to save the password once the secure field is filled; dismiss it
# here and again after the submit (whichever moment it appears).
- runFlow:
    when:
      visible: 'Save Password'
    commands:
      - tapOn: 'Not Now'
# Dismiss the keyboard by tapping the (non-interactive) screen header.
- tapOn:
    text: 'С возвращением'
- tapOn:
    id: login-submit-button
# The save-password sheet can appear either while typing or right after the
# submit; dismiss it both times.
- runFlow:
    when:
      visible: 'Save Password'
    commands:
      - tapOn: 'Not Now'
# The screen shown right after a successful login is nondeterministic:
# router.back() sometimes returns to Settings and sometimes lands on the
# Dashboard (an expo-router quirk with the dev-client deep-link launch -
# reported separately). So wait for the tab bar (it only appears once the
# login screen has popped, i.e. the login succeeded) and switch explicitly.
- extendedWaitUntil:
    visible:
      id: tab-settings
    timeout: 20000
- tapOn:
    id: tab-settings
- extendedWaitUntil:
    visible:
      id: screen-settings
    timeout: 15000
- assertVisible:
    id: settings-user-email
- scrollUntilVisible:
    element:
      id: settings-sync-section
    direction: DOWN
- assertVisible:
    id: settings-sync-section
- takeScreenshot: sync-signed-in
- tapOn:
    id: tab-dashboard
- extendedWaitUntil:
    visible:
      id: sync-status-badge
    timeout: 20000
- takeScreenshot: sync-badge
- tapOn:
    id: tab-settings
- tapOn:
    id: settings-logout-button
# After logout the app is anonymous again: no badge on the Dashboard.
- extendedWaitUntil:
    visible:
      id: settings-login-button
    timeout: 20000
- tapOn:
    id: tab-dashboard
- assertNotVisible:
    id: sync-status-badge
- takeScreenshot: sync-anonymous
