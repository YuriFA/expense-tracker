# nginx config for the built PWA (apps/web/dist). Served behind the shared
# Traefik gateway, which terminates TLS: this server speaks plain HTTP on :80
# and must never redirect to HTTPS (the gateway already did).

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json
               image/svg+xml application/wasm application/webmanifest;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Vite emits content-hashed files under /assets/ — safe to cache
        # forever.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Hashed workbox chunk lives at the root, not under /assets/.
        location ~* ^/workbox-[0-9a-f]+\.js$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # The service worker and the app shell must revalidate on every
        # fetch, or clients stall for up to 24h on stale deployments.
        # (The SPA fallback below internally redirects to /index.html,
        # so this location also stamps the shell itself.)
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
        location = /sw.js {
            add_header Cache-Control "no-cache";
        }
        location = /site.webmanifest {
            # Stock mime.types has no .webmanifest entry; browsers want
            # the manifest served as application/manifest+json.
            types { }
            default_type application/manifest+json;
            add_header Cache-Control "no-cache";
        }

        # SPA fallback: unknown paths return the app shell.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
