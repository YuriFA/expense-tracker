database:
  max_conns: 20
  min_conns: 2
  max_conn_idle_time: 30m
  max_conn_lifetime: 1h
http_server:
  address: "0.0.0.0:8080"
  read_timeout: 5s
  write_timeout: 30s
  idle_timeout: 60s
  cors:
    allowed_origins:
      - "http://localhost:5173"
      - "http://localhost:5174"
  session:
    TTL: 24h
    cookie_name: "session_id"
    secure: true
    same_site: "lax"
    sliding_expiration: true
    cleanup_interval: 6h
  failure_rate_limit:
    max_attempts: 5
    lockout_duration: 15m
