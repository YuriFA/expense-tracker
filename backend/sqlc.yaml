version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/repository/queries"
    schema: "internal/repository/postgres/migrations"
    gen:
      go:
        package: "db"
        out: "internal/repository/db"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_json_tags: false
        emit_enum_valid_method: true
        overrides:
          # UUIDs -> github.com/google/uuid.UUID; nullable ones -> *uuid.UUID.
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          # Timestamps -> time.Time (UTC everywhere); nullable -> *time.Time.
          - db_type: "timestamptz"
            go_type: "time.Time"
          # Dates (day-granularity, UTC midnight) -> time.Time.
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "timestamp"
            go_type: "time.Time"
