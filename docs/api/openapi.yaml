        категория исчезает из листингов, но сохраняется для синхронизации
        устройств.
      responses:
        "204":
          description: Удалено.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/CategoryNotFound"
        "409":
          $ref: "#/components/responses/CategoryInUse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/sync/push:
    post:
      tags: [Sync]
      operationId: syncPush
      summary: Push пакета клиентских операций
      description: |
        Применяет пакет операций offline-first клиента. Каждая операция
        обрабатывается независимо (частичный успех не откатывает применённые
        элементы) и получает свой результат:

        - `applied` — операция применена, `version` = новая серверная версия
          записи;
        - `conflict` — CAS-конфликт (`SYNC_VERSION_CONFLICT` при несовпадении
          `baseVersion`, `SYNC_ALREADY_EXISTS` когда запись с таким id уже
          существует и пришёл другой `opId`, `SYNC_DELETED_CONFLICT` когда
          запись на сервере удалена), `serverState` = текущее состояние записи;
        - `error` — нарушение бизнес-правил (например `CATEGORY_IN_USE`,
          `INVALID_REFS`, `CATEGORY_ALREADY_EXISTS`).

        Идемпотентность постоянна: повторная доставка уже применённого `opId`
        (в том числе в другом батче/сессии) возвращает сохранённый результат
        без побочных эффектов. Update применяется только если текущая версия
        записи на сервере равна `baseVersion`. Create (`baseVersion = 0`):
        записи нет → создать; есть + тот же `opId` → replay сохранённого
        результата; есть + другой `opId` → `SYNC_ALREADY_EXISTS` без
        перезаписи. Delete уже удалённой записи идемпотентен (`applied`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPushRequest"
      responses:
        "200":
          description: Per-item результаты в порядке операций запроса.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPushResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/sync/pull:
    get:
      tags: [Sync]
      operationId: syncPull
      summary: Инкрементальный pull изменений по курсору
      description: |
        Возвращает изменения user из change-log с `seq` строго больше
        `cursor`, в порядке `seq` (upsert + tombstone, с серверной `version`
        каждой записи), плюс `nextCursor` — курсор следующей страницы или
        `null`, когда клиент догнал сервер. Пагинация через `limit`; клиент
        продолжает с сохранённого курсора ровно с того места, где остановился.
      parameters:
        - name: cursor
          in: query
          description: Последний полученный seq (0 = с начала истории).
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: Page size (default 100, max 500).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Страница изменений + nextCursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPullResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
      description: |
        Stateful session cookie. Auth is session-based (NOT JWT): the server keeps
        session rows in the database and validates the cookie on every request.

        ## Session lifecycle

        - **Creation (`register`, `login`)** - always mints a fresh `session_id`
          and sets it in the cookie. Issuing a new ID on every login is a session
          fixation defense: the server never reuses an ID an attacker may have set
          before login. Existing sessions for that user are NOT invalidated -
          multi-session is supported (web + mobile in parallel).
        - **Logout** - invalidates ONLY the current session (deleted from the DB,
          cookie cleared). Other sessions for the user stay valid. Idempotent.
        - **Sliding expiration** - on every authenticated request, if less than
          25% of the TTL remains, the session is extended to `now + TTL` and the
          cookie refreshed. Without activity the session expires at `expires_at`.
        - **Password reset** - a successful reset revokes ALL of the user's
          sessions; the user re-logs in with the new password.
        - **User deletion** - `ON DELETE CASCADE` kills all of a user's sessions
          at the schema level.

  parameters:
    TransactionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Уникальный client-generated ключ (UUID recommended). Один ключ =
        один intent. Повтор того же запроса возвращает тот же ответ.
      schema:
        type: string
        maxLength: 255
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Не авторизован (нет валидной session cookie).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: UNAUTHORIZED
            message: missing session cookie
    InternalError:
      description: Внутренняя ошибка сервера.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: INTERNAL_ERROR
            message: internal server error
    ValidationError:
      description: Неверное тело запроса (validation failed).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
          example:
            code: VALIDATION_FAILED
            message: validation failed
            errors:
              - field: email
                message: email is required
    TransactionNotFound:
      description: Транзакция не найдена (или чужая).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: TRANSACTION_NOT_FOUND
            message: transaction not found
    TransactionVersionConflict:
      description: Конфликт в версии транзакции (optimistic concurrency).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: TRANSACTION_VERSION_CONFLICT
            message: transaction version conflict
    AccountNotFound:
      description: Счёт не найден (или чужой).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: ACCOUNT_NOT_FOUND
            message: account not found
    CategoryNotFound:
      description: Категория не найдена (или чужая).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: CATEGORY_NOT_FOUND
            message: category not found
    AccountInUse:
      description: Счёт имеет привязанные transactions, удаление невозможно.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: ACCOUNT_IN_USE
            message: account has transactions and cannot be deleted
    CategoryInUse:
      description: Категория имеет привязанные transactions, удаление невозможно.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: CATEGORY_IN_USE
            message: category has transactions and cannot be deleted
    CategoryAlreadyExists:
      description: Категория с таким name уже есть у user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: CATEGORY_ALREADY_EXISTS
            message: category already exists
    AccountAlreadyExists:
      description: Счет с таким id уже есть у user (клиентский id-дубликат).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: ACCOUNT_ALREADY_EXISTS
            message: account already exists
    AccountVersionConflict:
      description: Конфликт в версии счета (optimistic concurrency).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: ACCOUNT_VERSION_CONFLICT
            message: account version conflict

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
          description: Подтверждён ли email.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, email, emailVerified, createdAt, updatedAt]

    Transaction:
      type: object
      description: |
        Cashflow-транзакция (income/expense) содержит `accountId`+`categoryId`.
        Transfer содержит `fromAccountId`+`toAccountId`. Эти пары
        взаимоисключающие.
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
          enum: [income, expense, transfer]
        amount:
          type: integer
          format: int64
          description: Минорные единицы (divisor 100 для USD/EUR/RUB).
        description:
          type: string
        occurredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        accountId:
          type: string
          format: uuid
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        fromAccountId:
          type: string
          format: uuid
          nullable: true
        toAccountId:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
          format: int
          description: Версия транзакции
      required:
        [
          id,
          userId,
          type,
          amount,
          description,
          occurredAt,
          createdAt,
          updatedAt,
          version,
        ]

    TransactionCreateRequest:
      type: object
      required: [type, amount, occurredAt]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Опциональный клиентский id (UUID v4): offline-first клиенты
            генерируют его локально, сервер использует его как id записи.
            Дубликат для user → 409 `TRANSACTION_ALREADY_EXISTS`.
        type:
          type: string
          enum: [income, expense, transfer]
        amount:
          type: integer
          format: int64
          minimum: 1
        description:
          type: string
          default: ""
        occurredAt:
          type: string
          format: date-time
        accountId:
          type: string
          format: uuid
          description: Required для income/expense. Forbidden для transfer.
        categoryId:
          type: string
          format: uuid
          description: Required для income/expense. Forbidden для transfer.
        fromAccountId:
          type: string
          format: uuid
          description: Required для transfer. Forbidden для income/expense.
        toAccountId:
          type: string
          format: uuid
          description: Required для transfer. Forbidden для income/expense.

    TransactionUpdateRequest:
      type: object
      description: Все поля кроме `version` optional. Поле `type` менять нельзя.
      properties:
        version:
          type: integer
          format: int
          minimum: 1
        amount:
          type: integer
          format: int64
          minimum: 1
        description:
          type: string
        occurredAt:
          type: string
          format: date-time
        accountId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        fromAccountId:
          type: string
          format: uuid
        toAccountId:
          type: string
          format: uuid
      required: [version]

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: VALIDATION_FAILED
        message:
          type: string
          description: Human-readable сообщение.
      required: [code, message]

    ValidationErrorResponse:
      description: |
        ErrorResponse extended with a list of per-field validation errors.
        `errors` is required so this schema is distinguishable from the plain
        `ErrorResponse` inside `oneOf`.
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      required: [field, message]

    SessionResponse:
      type: object
      description: Метаданные сессии без токена.
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: Грубый proxy последней активности (обновляется при sliding).
        expiresAt:
          type: string
          format: date-time
        isCurrent:
          type: boolean
      required: [createdAt, updatedAt, expiresAt, isCurrent]

    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        currency:
          type: string
          enum: [USD, EUR, RUB]
        openingBalance:
          type: integer
          format: int64
        manualAdjustment:
          type: integer
          format: int64
        balance:
          type: integer
          format: int64
          description: Вычисляется сервером (opening + manual + Σ transactions).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int
          description: Версия счёта (optimistic concurrency).
      required: [id, userId, name, currency, openingBalance, manualAdjustment, balance, createdAt, updatedAt, version]

    AccountBalance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        currency:
          type: string
          enum: [USD, EUR, RUB]
        balance:
          type: integer
          format: int64
      required: [id, userId, name, currency, balance]

    AccountBalancesResponse:
      type: object
      properties:
        balances:
          type: array
          items:
            $ref: "#/components/schemas/AccountBalance"
        netWorth:
          type: integer
          format: int64
      required: [balances, netWorth]

    AccountCreateRequest:
      type: object
      required: [name, currency, openingBalance]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Опциональный клиентский id (UUID v4). Дубликат для user →
            409 `ACCOUNT_ALREADY_EXISTS`.
        name:
          type: string
        currency:
          type: string
          enum: [USD, EUR, RUB]
        openingBalance:
          type: integer
          format: int64

    AccountUpdateRequest:
      type: object
      description: |
        Все поля кроме `version` optional. `version` — optimistic concurrency
        (аналогично транзакциям): при параллельном изменении → 409
        `ACCOUNT_VERSION_CONFLICT`.
      properties:
        version:
          type: integer
          format: int
          minimum: 1
        name:
          type: string
          minLength: 3
        manualAdjustment:
          type: integer
          format: int64
      required: [version]

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [income, expense]
        icon:
          type: string
        color:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int
          description: Версия категории (optimistic concurrency).
      required: [id, userId, name, type, icon, color, createdAt, updatedAt, version]

    CategoryCreateRequest:
      type: object
      required: [name, type, icon, color]
      properties:
        id:
          type: string
          format: uuid
          description: |
            Опциональный клиентский id (UUID v4). Дубликат для user →
            409 `CATEGORY_ALREADY_EXISTS`.
        name:
          type: string
        type:
          type: string
          enum: [income, expense]
        icon:
          type: string
        color:
          type: string

    CategoryUpdateRequest:
      type: object
      description: |
        Все поля кроме `version` optional. `version` — optimistic concurrency:
        при параллельном изменении → 409 `CATEGORY_VERSION_CONFLICT`.
      properties:
        version:
          type: integer
          format: int
          minimum: 1
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum: [income, expense]
        icon:
          type: string
          minLength: 1
        color:
          type: string
          minLength: 1
      required: [version]

    AccountSyncData:
      type: object
      description: Полное состояние счёта в sync-операции (upsert).
      required: [name, currency, openingBalance, manualAdjustment]
      properties:
        name:
          type: string
        currency:
          type: string
          enum: [USD, EUR, RUB]
        openingBalance:
          type: integer
          format: int64
        manualAdjustment:
          type: integer
          format: int64

    CategorySyncData:
      type: object
      description: Полное состояние категории в sync-операции (upsert).
      required: [name, type, icon, color]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [income, expense]
        icon:
          type: string
        color:
          type: string

    TransactionSyncData:
      type: object
      description: |
        Полное состояние транзакции в sync-операции (upsert). Cashflow
        (income/expense) несёт `accountId`+`categoryId`, transfer —
        `fromAccountId`+`toAccountId`.
      required: [type, amount, description, occurredAt]
      properties:
        type:
          type: string
          enum: [income, expense, transfer]
        amount:
          type: integer
          format: int64
          minimum: 1
        description:
          type: string
        occurredAt:
          type: string
          format: date-time
        accountId:
          type: string
          format: uuid
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        fromAccountId:
          type: string
          format: uuid
          nullable: true
        toAccountId:
          type: string
          format: uuid
          nullable: true

    SyncEntity:
      type: string
      enum: [account, category, transaction]

    SyncOperation:
      type: object
      description: |
        Одна клиентская операция. `baseVersion` — серверная версия, на которой
        операция основана (0 = запись ещё не существует на сервере). Для
        upsert `data` содержит полное состояние записи; для delete `data`
        отсутствует.
      required: [opId, entity, action, id, baseVersion]
      properties:
        opId:
          type: string
          format: uuid
          description: Клиентский id операции; ключ постоянной идемпотентности.
        entity:
          $ref: "#/components/schemas/SyncEntity"
        action:
          type: string
          enum: [upsert, delete]
        id:
          type: string
          format: uuid
          description: Id записи (клиентский UUID v4 для baseVersion = 0).
        baseVersion:
          type: integer
          format: int
          minimum: 0
        data:
          oneOf:
            - $ref: "#/components/schemas/AccountSyncData"
            - $ref: "#/components/schemas/CategorySyncData"
            - $ref: "#/components/schemas/TransactionSyncData"
          description: Полное состояние записи; обязательно для upsert.

    SyncPushRequest:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/SyncOperation"

    SyncServerState:
      type: object
      description: Текущее состояние записи на сервере (в конфликте).
      required: [version, deleted]
      properties:
        version:
          type: integer
          format: int
        deleted:
          type: boolean
          description: true — запись tombstoned на сервере.
        data:
          oneOf:
            - $ref: "#/components/schemas/AccountSyncData"
            - $ref: "#/components/schemas/CategorySyncData"
            - $ref: "#/components/schemas/TransactionSyncData"
          description: Присутствует для не удалённой записи.

    SyncPushResult:
      type: object
      description: Результат одной операции; HTTP ответ — всегда 200.
      required: [opId, status]
      properties:
        opId:
          type: string
          format: uuid
        status:
          type: string
          enum: [applied, conflict, error]
        version:
          type: integer
          format: int
          description: Новая серверная версия записи (для status = applied).
        code:
          type: string
          description: |
            Machine-readable код (для conflict/error): `SYNC_VERSION_CONFLICT`,
            `SYNC_ALREADY_EXISTS`, `SYNC_DELETED_CONFLICT` либо коды
            бизнес-правил (`CATEGORY_IN_USE`, `INVALID_REFS`, ...).
        message:
          type: string
          description: Human-readable сообщение (для conflict/error).
        serverState:
          $ref: "#/components/schemas/SyncServerState"

    SyncPushResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SyncPushResult"

    SyncChange:
      type: object
      description: Одна запись change-log для pull.
      required: [seq, entity, id, action, version]
      properties:
        seq:
          type: integer
          format: int64
          description: Монотонный порядок изменения.
        entity:
          $ref: "#/components/schemas/SyncEntity"
        id:
          type: string
          format: uuid
        action:
          type: string
          enum: [upsert, tombstone]
        version:
          type: integer
          format: int
          description: Серверная версия записи после изменения.
        data:
          oneOf:
            - $ref: "#/components/schemas/AccountSyncData"
            - $ref: "#/components/schemas/CategorySyncData"
            - $ref: "#/components/schemas/TransactionSyncData"
          description: Полное состояние записи; присутствует для upsert.

    SyncPullResponse:
      type: object
      required: [changes, nextCursor]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/SyncChange"
        nextCursor:
          type: integer
          format: int64
          nullable: true
          description: Курсор следующей страницы; null — клиент догнал сервер.
