        "409":
          description: |
            Либо имя уже занята (`CATEGORY_ALREADY_EXISTS`), либо конфликт
            версии (`CATEGORY_VERSION_CONFLICT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                alreadyExists:
                  value:
                    code: CATEGORY_ALREADY_EXISTS
